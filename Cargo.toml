[package]
name = "koffan"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
license = "MIT"
description = "Client for the Koffan shopping list API, with tool definitions for LLM agents"
repository = "https://github.com/0rvar/koffan-rs"
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
wiremock = "0.6"
